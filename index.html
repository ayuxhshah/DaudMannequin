<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Daud Mannequin V7</title>

  <script type="importmap">
  {
    "imports": {
      "three":"https://cdn.jsdelivr.net/npm/three@0.163/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin:0;
      padding:0;
      background:transparent;
      overflow-x:hidden;
    }

    canvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:0;
    }

    #scroll-space{
      width:100%;
      height:600vh;
      pointer-events:none;
    }
  </style>
</head>

<body>

<canvas id="heroCanvas"></canvas>
<div id="scroll-space"></div>

<script type="module" src="./main.js"></script>

</body>
</html>
