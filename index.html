<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>Daud Hero</title>

  <!-- IMPORTANT: This fixes "Failed to resolve module specifier 'three'" -->
  <script type="importmap">
  {
    "imports": {
      "three":"https://cdn.jsdelivr.net/npm/three@0.163/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="heroCanvas"></canvas>

  <script type="module" src="./main.js"></script>
</body>
</html>
